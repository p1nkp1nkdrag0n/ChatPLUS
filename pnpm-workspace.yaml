packages:
  - apps/*
  - packages/*

# Same-major security floors for transitive dependencies.
overrides:
  "fast-uri@>=3.0.0 <3.1.7": 3.1.7
  "fast-uri@>=4.0.0 <4.1.4": 4.1.4
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
  - sharp
allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  sharp: true
